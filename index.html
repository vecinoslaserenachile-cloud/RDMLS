  <script>
    // DEEP SIGNAL SYNC v42: Recuperación Global ante Conflictos de Activos
    window.addEventListener('unhandledrejection', function(e) {
      const msg = (e.reason?.message || String(e.reason || "")).toLowerCase();
      if (msg.includes('failed to fetch dynamically imported module') || 
          msg.includes('chunkloaderror') || 
          msg.includes('importing a module script failed')) {
        
        console.warn("VLS_DEEP_SYNC: Chunk Load Conflict. Purging and Hard Reloading...");
        if ('caches' in window) {
          caches.keys().then(names => {
            for (let name of names) caches.delete(name);
          }).finally(() => {
            const sep = window.location.href.includes('?') ? '&' : '?';
            window.location.href = window.location.pathname + sep + 'vls_sync=' + Date.now();
          });
        } else {
          const sep = window.location.href.includes('?') ? '&' : '?';
          window.location.href = window.location.pathname + sep + 'vls_sync=' + Date.now();
        }
      }
    });
  </script>
  <script>
    // PRE-HYDRATION BRANDING (Avoid flashing VLS on RDMLS Domains)
    if (window.location.hostname.includes('rdmls') || (window.location.hostname.includes('laserena.cl') && !window.location.hostname.includes('vecinos'))) {
      document.title = "RDMLS · Radio Digital Municipal";
      document.querySelector("meta[name='theme-color']").setAttribute('content', '#8B1D19');
      document.querySelectorAll("link[rel='icon'], link[rel='apple-touch-icon']").forEach(el => el.setAttribute('href', '/rdmls_favicon.png'));
    }
  </script>
  <script>
    // VLS_DEEP_TISSUE_RECOVERY v43
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) { registration.unregister(); console.log("VLS: SW Killed"); }
      });
    }
    if ('caches' in window) {
      caches.keys().then(names => {
        for (let name of names) caches.delete(name);
      });
    }
  </script>
