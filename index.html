<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Active Defense Layer (Simulated/Basic WAF configuration) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Note: A full strict CSP requires server backend, but we declare safe origin limits -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' 'unsafe-inline' 'unsafe-eval' blob: http: https: ws: wss:; img-src 'self' data: blob: https: http:; object-src 'none'; font-src 'self' data: https:">

  <link rel="icon" type="image/svg+xml" href="/vls-crystal-icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/vls-logo-3d.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/vls-logo-3d.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#38bdf8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Open Graph Data for Social Media -->
  <meta property="og:title" content="La Serena Smart City 2026 - Portal Vecinal / VLSABES" />
  <meta property="og:description" content="Ecosistema de Innovación, Seguridad y Co-creación Ciudadana. ¡Sé parte del futuro de nuestra comuna y ponte a prueba en nuestro juego trivia!" />
  <meta property="og:image" content="/img_trivia/50serenitoBisabueloVLSABES.png" />
  <meta property="og:type" content="website" />

  <meta name="rdmls-version" content="2026-03-27-IMLS-v42">
  <title>vecinoslaserena.cl</title>
  <script>
    // DEEP SIGNAL SYNC v42: Recuperación Global ante Conflictos de Activos
    window.addEventListener('unhandledrejection', function(e) {
      const msg = (e.reason?.message || String(e.reason || "")).toLowerCase();
      if (msg.includes('failed to fetch dynamically imported module') || 
          msg.includes('chunkloaderror') || 
          msg.includes('importing a module script failed')) {
        
        console.warn("VLS_DEEP_SYNC: Chunk Load Conflict. Purging and Hard Reloading...");
        if ('caches' in window) {
          caches.keys().then(names => {
            for (let name of names) caches.delete(name);
          }).finally(() => {
            const sep = window.location.href.includes('?') ? '&' : '?';
            window.location.href = window.location.pathname + sep + 'vls_sync=' + Date.now();
          });
        } else {
          const sep = window.location.href.includes('?') ? '&' : '?';
          window.location.href = window.location.pathname + sep + 'vls_sync=' + Date.now();
        }
      }
    });
  </script>
  <script>
    // PRE-HYDRATION BRANDING (Avoid flashing VLS on RDMLS Domains)
    if (window.location.hostname.includes('rdmls') || (window.location.hostname.includes('laserena.cl') && !window.location.hostname.includes('vecinos'))) {
      document.title = "RDMLS · Radio Digital Municipal";
      document.querySelector("meta[name='theme-color']").setAttribute('content', '#8B1D19');
      document.querySelectorAll("link[rel='icon'], link[rel='apple-touch-icon']").forEach(el => el.setAttribute('href', '/rdmls_favicon.png'));
    }
  </script>
  <script>
    function logErrorToConsole(msg, isPromise) {
      let consoleDiv = document.getElementById('vls-mini-error-console');
      if (!consoleDiv) {
        consoleDiv = document.createElement('div');
        consoleDiv.id = 'vls-mini-error-console';
        consoleDiv.style.cssText = 'position:fixed; bottom:10px; left:10px; z-index:999999; max-width:300px; max-height:150px; overflow-y:auto; background:rgba(0,0,0,0.8); color:#ef4444; border:1px solid #ef4444; border-radius:8px; padding:10px; font-family:monospace; font-size:10px; opacity:0.9; box-shadow:0 0 10px rgba(0,0,0,0.5); pointer-events:auto;';
        
        const closeBtn = document.createElement('button');
        closeBtn.innerHTML = 'x';
        closeBtn.style.cssText = 'float:right; background:transparent; border:none; color:white; cursor:pointer; font-weight:bold; height:20px; width:20px;';
        closeBtn.onclick = () => consoleDiv.style.display = 'none';
        
        const title = document.createElement('strong');
        title.style.color = '#facc15';
        title.innerHTML = 'LOG DE ERRORES<br/>';
        
        const contentDiv = document.createElement('div');
        contentDiv.id = 'vls-error-content';
        
        consoleDiv.appendChild(closeBtn);
        consoleDiv.appendChild(title);
        consoleDiv.appendChild(contentDiv);
        document.body.appendChild(consoleDiv);
      }
      
      consoleDiv.style.display = 'block';
      const content = document.getElementById('vls-error-content');
      const errEl = document.createElement('div');
      errEl.style.borderBottom = '1px solid rgba(239, 68, 68, 0.3)';
      errEl.style.paddingBottom = '4px';
      errEl.style.marginBottom = '4px';
      errEl.innerText = (isPromise ? '[PROMISE] ' : '[ERROR] ') + msg;
      content.appendChild(errEl);
      content.scrollTop = content.scrollHeight;
    }

    window.addEventListener('error', function (e) {
      logErrorToConsole(e.error ? e.error.message : e.message, false);
      // No detener la propagación, esto evita 'matar' la app
    });
    window.addEventListener('unhandledrejection', function (e) {
      let msg = e.reason;
      if (e.reason && e.reason.message) msg = e.reason.message;
      logErrorToConsole(msg, true);
    });

    // AGGRESSIVE PURGE FOR RDMLS (Institutional Mode)
    if (window.location.hostname.includes('rdmls') || (window.location.hostname.includes('laserena.cl') && !window.location.hostname.includes('vecinos'))) {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (let registration of registrations) { registration.unregister(); }
        });
      }
      if ('caches' in window) {
        caches.keys().then(names => {
          for (let name of names) caches.delete(name);
        });
      }
    }
  </script>
</head>

<body>
  <!-- C5-HYPER-SYNC: Purga Automática de Caché v36 -->
  <script>
    window.addEventListener('error', function(e) {
      if (e.target && e.target.tagName === 'SCRIPT' && e.target.src && (e.target.src.includes('main') || e.target.src.includes('index'))) {
        console.warn("VLS_RECOVERY: Signal Conflict Detected. Purging Cache Storage...");
        if ('caches' in window) {
          caches.keys().then(names => {
            for (let name of names) caches.delete(name);
          }).finally(() => {
            window.location.reload(true);
          });
        } else {
          window.location.reload(true);
        }
      }
    }, true);
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
