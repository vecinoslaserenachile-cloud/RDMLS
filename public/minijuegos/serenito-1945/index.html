<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego Serenito 1945 - Master Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        #juegoCanvas {
            background-color: #0f172a;
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.2);
            max-width: 100%;
            max-height: 100%;
            border: 4px solid #1e293b;
        }
        #uiLayer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            pointer-events: auto;
        }
        .stat-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        #gameOverScreen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(2, 6, 23, 0.98);
            padding: 50px;
            border-radius: 30px;
            border: 4px solid #f43f5e;
            box-shadow: 0 0 100px rgba(244, 63, 94, 0.3);
            pointer-events: auto;
            z-index: 1000;
        }
        #gameOverScreen h1 {
            color: #f43f5e;
            margin-top: 0;
            font-size: 42px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        #gameOverScreen p {
            color: #94a3b8;
            font-size: 24px;
            margin-bottom: 35px;
        }
        button {
            background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 25px rgba(244, 63, 94, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 35px rgba(244, 63, 94, 0.6);
        }
        .controls-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(148, 163, 184, 0.6);
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <canvas id="juegoCanvas"></canvas>
    
    <div id="uiLayer">
        <div class="stats">
            <div class="stat-box">SCORE: <span id="scoreVal">0</span></div>
            <div class="stat-box">BOMBS: <span id="bombVal">10</span></div>
        </div>
        
        <div id="gameOverScreen">
            <h1>MISIÓN FALLIDA</h1>
            <p>Puntuación: <strong id="finalScore" style="color: white;">0</strong></p>
            <button onclick="reiniciarJuego()">REINTENTAR</button>
        </div>

        <div class="controls-hint">
            ESPACIO: METRALLETA • B/X: BOMBAS • FLECHAS: MOVER
        </div>
    </div>

    <script>
        const canvas = document.getElementById('juegoCanvas');
        const ctx = canvas.getContext('2d');
        const scoreUI = document.getElementById('scoreVal');
        const bombUI = document.getElementById('bombVal');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreUI = document.getElementById('finalScore');

        function resizeCanvas() {
            let isMobile = window.innerWidth <= 600;
            canvas.width = isMobile ? window.innerWidth : 500;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let score = 0;
        let bombs = 10;
        let gameOver = false;
        let frames = 0;
        
        let fondoY1 = 0;
        let fondoY2 = -canvas.height;
        const velocidadMundo = 4;

        const jugador = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 150,
            width: 56,
            height: 60,
            velocidad: 8,
            color1: '#ef4444', // Red
            color2: '#ffffff'  // White
        };

        let balas = [];
        let bombas_proyectiles = [];
        let enemigos = [];
        let groundElements = [];
        let explosiones = [];

        const teclas = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, Space: false, KeyB: false, KeyX: false };

        window.addEventListener('keydown', (e) => {
            if (teclas.hasOwnProperty(e.code)) teclas[e.code] = true;
            if (e.code === 'Space') disparar();
            if (e.code === 'KeyB' || e.code === 'KeyX') lanzarBomba();
        });
        window.addEventListener('keyup', (e) => {
            if (teclas.hasOwnProperty(e.code)) teclas[e.code] = false;
        });

        canvas.addEventListener('touchstart', (e) => { moverTactil(e); });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); moverTactil(e); }, { passive: false });

        function moverTactil(e) {
            if (gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            jugador.x = Math.max(0, Math.min(canvas.width - jugador.width, touch.clientX - rect.left - (jugador.width / 2)));
            jugador.y = Math.max(0, Math.min(canvas.height - jugador.height, touch.clientY - rect.top - (jugador.height / 2)));
            if (frames % 5 === 0) disparar();
            if (frames % 20 === 0) lanzarBomba();
        }

        function disparar() {
            if (gameOver) return;
            balas.push({ x: jugador.x + (jugador.width / 2) - 4, y: jugador.y, width: 8, height: 20, velocidad: 15, color: '#fbbf24' });
        }

        function lanzarBomba() {
            if (gameOver || bombs <= 0) return;
            bombs--;
            bombas_proyectiles.push({ 
                x: jugador.x + (jugador.width / 2) - 10, 
                y: jugador.y + 20, 
                width: 20, 
                height: 30, 
                velocidad: 2, 
                scale: 1,
                timer: 40 
            });
        }

        function spawnEnemy() {
            if (frames % 40 === 0) {
                const colors = ['#38bdf8', '#fbbf24', '#a855f7', '#10b981'];
                const size = 50;
                enemigos.push({
                    x: Math.random() * (canvas.width - size),
                    y: -size,
                    width: size,
                    height: size,
                    velocidad: Math.random() * 3 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        function spawnGround() {
            if (frames % 100 === 0) {
                const types = ['hangar', 'radar', 'tanque', 'planta'];
                const type = types[Math.floor(Math.random() * types.length)];
                groundElements.push({
                    x: Math.random() * (canvas.width - 80),
                    y: -100,
                    width: type === 'hangar' ? 80 : 40,
                    height: type === 'hangar' ? 60 : 40,
                    type: type,
                    hp: type === 'hangar' ? 3 : 1
                });
            }
        }

        function colision(r1, r2) {
            return r1.x < r2.x + r2.width && r1.x + r1.width > r2.x && r1.y < r2.y + r2.height && r1.y + r1.height > r2.y;
        }

        function actualizar() {
            if (gameOver) return;
            
            fondoY1 += velocidadMundo;
            fondoY2 += velocidadMundo;
            if (fondoY1 >= canvas.height) fondoY1 = fondoY2 - canvas.height;
            if (fondoY2 >= canvas.height) fondoY2 = fondoY1 - canvas.height;

            if (teclas.ArrowLeft && jugador.x > 0) jugador.x -= jugador.velocidad;
            if (teclas.ArrowRight && jugador.x < canvas.width - jugador.width) jugador.x += jugador.velocidad;
            if (teclas.ArrowUp && jugador.y > 0) jugador.y -= jugador.velocidad;
            if (teclas.ArrowDown && jugador.y < canvas.height - jugador.height) jugador.y += jugador.velocidad;

            balas.forEach((b, i) => {
                b.y -= b.velocidad;
                if (b.y < -50) balas.splice(i, 1);
            });

            bombas_proyectiles.forEach((b, i) => {
                b.y += 1; // Cae lento respecto al avion
                b.scale += 0.02; // Efecto de caer hacia el suelo
                b.timer--;
                if (b.timer <= 0) {
                    crearExplosion(b.x + b.width/2, b.y + b.height/2, true);
                    bombas_proyectiles.splice(i, 1);
                }
            });

            enemigos.forEach((e, i) => {
                e.y += e.velocidad;
                if (e.y > canvas.height) enemigos.splice(i, 1);
                
                balas.forEach((b, bi) => {
                    if (colision(b, e)) {
                        crearExplosion(e.x + e.width/2, e.y + e.height/2);
                        enemigos.splice(i, 1);
                        balas.splice(bi, 1);
                        score += 100;
                    }
                });

                if (colision(jugador, e)) terminarJuego();
            });

            groundElements.forEach((g, i) => {
                g.y += velocidadMundo;
                if (g.y > canvas.height) groundElements.splice(i, 1);

                bombas_proyectiles.forEach((b, bi) => {
                    if (b.timer < 5 && colision(b, g)) {
                        g.hp--;
                        if (g.hp <= 0) {
                            crearExplosion(g.x + g.width/2, g.y + g.height/2, true);
                            groundElements.splice(i, 1);
                            score += 500;
                            bombs += 1; // Reward bomb
                        }
                    }
                });
            });

            explosiones.forEach((ex, i) => {
                ex.radius += 2;
                ex.opacity -= 0.02;
                if (ex.opacity <= 0) explosiones.splice(i, 1);
            });

            spawnEnemy();
            spawnGround();
            scoreUI.innerText = score;
            bombUI.innerText = bombs;
            frames++;
        }

        function crearExplosion(x, y, isBig = false) {
            explosiones.push({ x, y, radius: 10, opacity: 1, color: isBig ? '#f59e0b' : '#f43f5e' });
        }

        function dibujarFondo() {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.05)';
            ctx.beginPath();
            for(let x = 0; x < canvas.width; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); }
            for(let y = (fondoY1 % 40); y < canvas.height; y += 40) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); }
            ctx.stroke();
        }

        function dibujarJugador() {
            ctx.save();
            ctx.translate(jugador.x + jugador.width/2, jugador.y + jugador.height/2);
            
            // Wings
            ctx.fillStyle = jugador.color1;
            ctx.fillRect(-28, -5, 56, 12);
            ctx.fillStyle = jugador.color2;
            ctx.fillRect(-28, 0, 56, 2);
            
            // Fuselage
            ctx.fillStyle = jugador.color2;
            ctx.fillRect(-8, -25, 16, 50);
            ctx.fillStyle = jugador.color1;
            ctx.fillRect(-8, -10, 16, 5);
            
            // Cockpit
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(-4, -18, 8, 12);
            
            // Engines
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-22, 2, 8, 10);
            ctx.fillRect(14, 2, 8, 10);

            // Tail
            ctx.fillStyle = jugador.color1;
            ctx.fillRect(-15, 20, 30, 6);
            
            ctx.restore();
        }

        function dibujarEnemigo(e) {
            ctx.save();
            ctx.translate(e.x + e.width/2, e.y + e.height/2);
            ctx.rotate(Math.PI);
            
            ctx.fillStyle = e.color;
            ctx.fillRect(-20, -5, 40, 10); // Wings
            ctx.fillRect(-6, -20, 12, 40); // Body
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(-2, -15, 4, 8); // Cockpit
            
            ctx.restore();
        }

        function dibujarGround(g) {
            ctx.save();
            ctx.translate(g.x, g.y);
            
            if (g.type === 'hangar') {
                ctx.fillStyle = '#334155';
                ctx.fillRect(0, 0, g.width, g.height);
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(0, 0, g.width, 10); // Roof
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(10, 20, g.width - 20, g.height - 20); // Door
            } else if (g.type === 'radar') {
                ctx.fillStyle = '#94a3b8';
                ctx.fillRect(g.width/2 - 5, g.height - 10, 10, 10); // Base
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(g.width/2, g.height/2, 15, 0, Math.PI * 2);
                ctx.stroke();
                // Scanning line
                ctx.save();
                ctx.translate(g.width/2, g.height/2);
                ctx.rotate(frames * 0.1);
                ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(15, 0); ctx.stroke();
                ctx.restore();
            } else if (g.type === 'tanque') {
                ctx.fillStyle = '#166534'; // Drab Green
                ctx.fillRect(5, 10, 30, 20); // Body
                ctx.fillStyle = '#14532d';
                ctx.fillRect(10, 5, 20, 15); // Turret
                ctx.fillRect(20, 0, 4, 15); // Cannon
            }
            
            ctx.restore();
        }

        function dibujar() {
            dibujarFondo();
            
            groundElements.forEach(dibujarGround);
            
            balas.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = b.color;
                ctx.fillRect(b.x, b.y, b.width, b.height);
                ctx.shadowBlur = 0;
            });

            bombas_proyectiles.forEach(b => {
                ctx.save();
                ctx.translate(b.x + b.width/2, b.y + b.height/2);
                ctx.scale(b.scale, b.scale);
                ctx.fillStyle = '#475569';
                ctx.beginPath();
                ctx.ellipse(0, 0, 10, 15, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(-5, -15, 10, 4); // Fins
                ctx.restore();
            });

            enemigos.forEach(dibujarEnemigo);
            dibujarJugador();
            
            explosiones.forEach(ex => {
                ctx.save();
                ctx.globalAlpha = ex.opacity;
                ctx.fillStyle = ex.color;
                ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            });
        }

        function terminarJuego() {
            gameOver = true;
            gameOverScreen.style.display = 'block';
            finalScoreUI.innerText = score;
        }

        function reiniciarJuego() {
            score = 0;
            bombs = 10;
            frames = 0;
            enemigos = [];
            balas = [];
            bombas_proyectiles = [];
            groundElements = [];
            explosiones = [];
            jugador.x = canvas.width / 2 - (jugador.width / 2);
            jugador.y = canvas.height - 150;
            gameOver = false;
            gameOverScreen.style.display = 'none';
        }

        function loop() {
            actualizar();
            dibujar();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
